services:
  - type: web
    name: carbiz-v5-1-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: VISION_MODEL
        value: gpt-5.6
      - key: IMAGE_MODEL
        value: gpt-image-2
      - key: ALLOWED_ORIGINS
        value: "*"
